# SPDX-License-Identifier: Apache-2.0
# Security static analysis of the JavaScript/TypeScript code (plugin API, protocol reference, tests, scripts) with GitHub CodeQL.
# Findings appear under Security → Code scanning. Swift and Java are not scanned here (they need a macOS/Xcode or
# Android Gradle build); their code is covered by the compilers and the cross-verification scripts.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1' # weekly, Monday 03:27 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
